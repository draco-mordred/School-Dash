name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-tests:
    name: Backend tests (bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run tests
        shell: bash
        run: set -o pipefail; bun test tests 2>&1 | tee bun-test-output.log
      - name: Build (esbuild bundle — catches errors Render Docker build would hit)
        shell: bash
        run: set -o pipefail; bun run build 2>&1 | tee bun-build-output.log
      - name: Report test failure on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let log = "";
            try { log = fs.readFileSync("backend/bun-test-output.log", "utf8"); } catch {}
            if (!log) return;
            const tail = log.slice(-6000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "**Backend tests (bun) failed** (CI)\n\n```\n" + tail + "\n```",
            });
      - name: Report build failure on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let log = "";
            try { log = fs.readFileSync("backend/bun-build-output.log", "utf8"); } catch {}
            if (!log) return;
            const tail = log.slice(-8000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "**Backend build (esbuild bundle) failed** (CI — this is what breaks the Render Docker build)\n\n```\n" + tail + "\n```",
            });


  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        shell: bash
        run: set -o pipefail; npm run test 2>&1 | tee vitest-output.log
      - name: Report failure on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let log = "";
            try { log = fs.readFileSync("frontend/vitest-output.log", "utf8"); } catch {}
            const tail = log.slice(-6000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "**Frontend tests (vitest) failed** (CI)\n\n```\n" + tail + "\n```",
            });
